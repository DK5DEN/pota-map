# Cache finished tiles; the resolver behind it does not even get asked.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:32m
                 max_size=3g inactive=30d use_temp_path=off;

map $sent_http_content_type $cache_policy {
    default                       "public, max-age=300";
    application/javascript        "public, max-age=604800, immutable";
    text/css                      "public, max-age=604800, immutable";
    font/woff2                    "public, max-age=2592000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types application/json application/geo+json application/javascript
               text/css text/plain image/svg+xml application/x-protobuf;

    # Tile archives: MapLibre fetches ranges out of them, hence range support
    # (default in nginx) and a long cache lifetime.
    location = /tiles/basemap.pmtiles {
        alias /data/basemap/basemap.pmtiles;
        add_header Cache-Control "public, max-age=604800";
        add_header Accept-Ranges bytes;
    }

    # Cache briefly and always revalidate: the archive is rebuilt weekly, and
    # stale range responses produce an empty map.
    location = /tiles/parks.pmtiles {
        alias /data/parks.pmtiles;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header Accept-Ranges bytes;
    }

    # Web files built by the pipeline (search index, GeoJSON per park)
    location /data/ {
        alias /data/web/;
        add_header Cache-Control "public, max-age=1800";
        types { application/json json; application/geo+json geojson; }
        default_type application/json;
    }

    # z/x/y tiles: the pmtiles service resolves the archive directories
    # locally (microseconds instead of a round trip per level), nginx keeps
    # the result.
    #
    # Split per archive because they change at different rates: the basemap is
    # only refreshed by hand, the park areas weekly.
    location /t/basemap/ {
        proxy_pass http://tiles:8081/basemap/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache tiles;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 204 30d;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /t/parks/ {
        proxy_pass http://tiles:8081/parks/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache tiles;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 204 1h;
        proxy_cache_valid 404 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        add_header X-Cache $upstream_cache_status;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Glyphs are protobuf and appear in no MIME table; without an explicit
    # type gzip does not apply, and that is 656 KB on the first visit.
    location /fonts/ {
        types { application/x-protobuf pbf; }
        default_type application/x-protobuf;
        gzip on;
        gzip_types application/x-protobuf;
        gzip_min_length 512;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /sprites/ { add_header Cache-Control "public, max-age=2592000, immutable"; }

    # index.html points at file names carrying a content hash and must
    # therefore NEVER be cached - otherwise the browser keeps running the old
    # build and does not see changes for days.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The service worker has no hash in its name; it has to be revalidated on
    # every call, otherwise an old version sticks and keeps deciding what gets
    # cached.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # The page only uses hash and query parameters, no client side routing.
    # Hence no fallback to index.html - missing scripts would be served HTML
    # and fail silently (see the MapLibre worker).
    location / {
        add_header Cache-Control $cache_policy;
        try_files $uri $uri/ =404;
    }

    # MapLibre cannot be renamed (its worker looks for its neighbours relative
    # to its own path), so no content hash and therefore no "immutable".
    # Revalidating hourly is cheap enough.
    location /vendor/ {
        types { application/javascript mjs js; }
        default_type application/javascript;
        add_header Cache-Control "public, max-age=3600";
    }
}
