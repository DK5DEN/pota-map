<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title data-i18n="app.title">POTA-Map</title>
<meta name="description" content="Schnelle Karte der POTA-Parkgrenzen in Deutschland, Österreich, der Schweiz, Liechtenstein, Tschechien, Dänemark und Luxemburg — mit Live-Spots.">
<!-- MapLibres Stilvorlage haelt sonst das erste Zeichnen auf: 12,9 KB, davon
     92 % ungenutzt, und gebraucht wird sie erst, wenn die Karte da ist - also
     eine Sekunde spaeter. `media="print"` laedt sie ohne zu blockieren, das
     onload schaltet sie scharf. Ohne Skript greift das noscript. -->
<link rel="stylesheet" href="/maplibre-gl.css" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="/maplibre-gl.css"></noscript>
<link rel="stylesheet" href="/style.css">

<!-- Otherwise the module chain app.js -> maplibre-gl.mjs -> ...-shared.mjs
     runs one after the other, and every step costs a full round trip. With
     modulepreload all three start at the same time. -->
<!-- Only fetched when this installation has reporting, see src/main.js. -->
  <meta name="reports-src" content="/reports.js">
  <link rel="modulepreload" href="/vendor/maplibre-gl.mjs">
<link rel="modulepreload" href="/vendor/maplibre-gl-shared.mjs">
<link rel="modulepreload" href="/vendor/maplibre-gl-worker.mjs">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌲</text></svg>">

<script>
/* Startet die Kacheln der ersten Ansicht, bevor MapLibre ueberhaupt geladen
   ist. Die Antworten landen im HTTP-Zwischenspeicher; wenn die Karte kurz
   darauf dieselben Adressen anfordert, liegen sie schon da. */
(function () {
  try {
    var m = location.hash.match(/^#(\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
    var zoom = m ? +m[1] : 5.4;
    var lat = m ? +m[2] : 50.71;
    var lon = m ? +m[3] : 10.2;
    var z = Math.max(0, Math.min(14, Math.floor(zoom)));
    var n = Math.pow(2, z);

    function xOf(lo) { return Math.floor((lo + 180) / 360 * n); }
    function yOf(la) {
      var r = la * Math.PI / 180;
      return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
    }

    /* Ausdehnung der Ansicht in Grad, grob aus der Fensterbreite */
    /* Ausdehnung in Kachel-Einheiten; der Bruchteil des Zoom zaehlt mit */
    var scale = Math.pow(2, zoom - z);
    var halfW = (window.innerWidth / 512 / scale) / 2;
    var halfH = (window.innerHeight / 512 / scale) / 2;

    function xf(lo) { return (lo + 180) / 360 * n; }
    function yf(la) {
      var r = la * Math.PI / 180;
      return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
    }

    var cx = xf(lon), cy = yf(lat);
    var x0 = Math.floor(cx - halfW), x1 = Math.floor(cx + halfW);
    var y0 = Math.floor(cy - halfH), y1 = Math.floor(cy + halfH);

    /* Dieselben Grenzen wie die Kartenquellen - sonst holen wir Kacheln,
       die MapLibre nie anfordert. */
    var B = [5.5, 45.4, 19.2, 58.1];
    function inBounds(x, y) {
      var w = x / n * 360 - 180, e = (x + 1) / n * 360 - 180;
      function latOf(t) {
        var s = Math.PI * (1 - 2 * t / n);
        return 180 / Math.PI * Math.atan(0.5 * (Math.exp(s) - Math.exp(-s)));
      }
      var north = latOf(y), south = latOf(y + 1);
      return e > B[0] && w < B[2] && north > B[1] && south < B[3];
    }

    /* Whoever picked a raster base never sees our own base tiles, so
       fetching them here would be mobile data thrown away. The foreign tiles
       never enter this list: those are fetched by MapLibre alone, for what is
       on the screen right now. */
    var raster = true;   /* the default base is a raster one */
    try {
      var saved = JSON.parse(localStorage.getItem('pota-settings') || '{}');
      raster = !(saved && (saved.base === 'light' || saved.base === 'dark'));
    } catch (e) { /* no storage: the default it is, and that is raster */ }

    var urls = [];
    for (var x = x0; x <= x1 && urls.length < 16; x++) {
      for (var y = y0; y <= y1 && urls.length < 16; y++) {
        if (x < 0 || y < 0 || x >= n || y >= n || !inBounds(x, y)) continue;
        if (!raster) urls.push('/t/basemap/' + z + '/' + x + '/' + y + '.mvt');
        if (z >= 4) urls.push('/t/parks/' + z + '/' + x + '/' + y + '.mvt');
      }
    }
    urls.forEach(function (u) { fetch(u, { priority: 'high' }).catch(function () {}); });
  } catch (e) { /* Vorabruf ist Beiwerk, niemals ein Grund zu scheitern */ }
})();
</script>
</head>
<body>
<div id="map"></div>

<header id="topbar">
  <button id="menu-toggle" class="icon-btn" data-i18n-label="menu.toggle" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <h1 data-i18n="app.name">POTA-Map</h1>
  <div id="search-wrap">
    <input id="search" type="search" placeholder="Referenz oder Name suchen&#8230;" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false" data-i18n-label="search.aria">
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <div id="status" data-i18n-title="status.title"></div>
  <!-- Reporting sits in the header, not in a tab: a missing park or a wrong
       boundary is noticed while looking at the map, and a report worth making
       must not depend on finding the right tab first. Hidden until the server
       says it has reporting, see src/main.js. -->
  <button id="report-btn" class="icon-btn" data-i18n-label="report.button" data-i18n-title="report.button" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.9-.9L3 20.5l1.5-4.6A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/><path d="M12 8v4"/><path d="M12 15.5h.01"/></svg>
  </button>
  <div data-afu-menu data-ohne="pota-map.afu.tools" data-ausrichtung="rechts"></div>
</header>

<!-- The panel is split into tabs, following the question you have right now:
     what does the map show (Karte), who is on the air (Spots), what have I
     done already (Ich), what do I need outdoors (Unterwegs). One column of
     thirteen sections is longer than any screen, and the legend ends up
     behind things you set once and never touch again. -->
<aside id="panel" data-i18n-label="panel.aria" hidden>
  <div class="tabs" role="tablist" data-i18n-label="tabs.aria">
    <button role="tab" id="tabbtn-map" data-tab="map" aria-controls="tab-map" aria-selected="true" data-i18n="tabs.map"></button>
    <button role="tab" id="tabbtn-spots" data-tab="spots" aria-controls="tab-spots" aria-selected="false" tabindex="-1" data-i18n="tabs.spots"></button>
    <button role="tab" id="tabbtn-me" data-tab="me" aria-controls="tab-me" aria-selected="false" tabindex="-1" data-i18n="tabs.me"></button>
    <button role="tab" id="tabbtn-outdoors" data-tab="outdoors" aria-controls="tab-outdoors" aria-selected="false" tabindex="-1" data-i18n="tabs.outdoors"></button>
  </div>

  <div class="tabpanel" id="tab-map" role="tabpanel" aria-labelledby="tabbtn-map">
    <section>
      <h2 data-i18n="programs.head"></h2>
      <div id="programs" class="checks"></div>
      <p class="hint" data-i18n="programs.hint"></p>
    </section>

    <section>
      <h2 data-i18n="display.head"></h2>
      <label class="check"><input type="checkbox" id="opt-spots"> <span data-i18n="display.spots"></span></label>
      <label class="check"><input type="checkbox" id="opt-sota"> <span data-i18n="display.sota"></span></label>
      <p class="hint" id="sotahint" data-i18n="display.sotaHint" hidden></p>
      <label class="check"><input type="checkbox" id="opt-never"> <span data-i18n="display.never"></span></label>
      <label class="check"><input type="checkbox" id="opt-points"> <span data-i18n="display.points"></span></label>
      <label class="check"><input type="checkbox" id="opt-plans"> <span data-i18n="display.plans"></span></label>
      <label class="check"><input type="checkbox" id="opt-nfer"> <span data-i18n="display.nfer"></span></label>
      <p class="hint" data-i18n="display.nferHint"></p>
    </section>

    <section>
      <h2 data-i18n="look.head"></h2>
      <p class="seghead" data-i18n="look.language"></p>
      <select id="language" data-i18n-label="look.language"></select>
      <p class="seghead" data-i18n="look.base"></p>
      <!-- The plain light vector theme has no button for the time being: it
           leaves the path network hairline thin, and that is what people come
           for. It is still built and still saved for offline use, see
           HIDDEN_BASES in src/main.js - putting `<button data-base="light">`
           back here is all it takes to have it again. The pastel base is the
           same tiles with a warmer palette and the paths drawn. -->
      <div class="seg" id="basemaps">
        <button data-base="osm" class="on" data-i18n="look.light"></button>
        <button data-base="pastel" data-i18n="look.pastel"></button>
        <button data-base="dark" data-i18n="look.dark"></button>
        <button data-base="topo" data-i18n="look.topo"></button>
      </div>
      <!-- Filled from the catalogue: which text belongs here depends on the
           base that is on, see showBaseHint() in src/main.js. -->
      <p class="hint" id="base-hint" hidden></p>
      <p class="seghead" data-i18n="look.saturation"></p>
      <div class="sliderrow">
        <input type="range" id="saturation" min="0" max="100" step="5" value="55"
               data-i18n-label="look.saturation">
        <output id="saturation-value" for="saturation"></output>
      </div>
      <p class="hint" data-i18n="look.satHint"></p>
      <p class="seghead" data-i18n="look.sharpness"></p>
      <div class="seg" id="quality">
        <button data-q="auto" class="on" data-i18n="look.auto"></button>
        <button data-q="sharp" data-i18n="look.sharp"></button>
        <button data-q="smooth" data-i18n="look.smooth"></button>
      </div>
      <p class="hint" id="quality-hint" data-i18n="look.qualityHint"></p>
    </section>

    <section>
      <h2 data-i18n="legend.head"></h2>
      <ul class="legend">
        <li><i class="sw" style="--c:#e02424"></i><span data-i18n="legend.park"></span></li>
        <li><i class="sw" style="--c:#9333ea"></i><span data-i18n="legend.never"></span></li>
        <li><i class="sw" id="legend-own" style="--c:#00a86b"></i><span data-i18n="legend.mine"></span></li>
        <li><i class="sw" style="--c:#0d9488"></i><span data-i18n="legend.hunted"></span></li>
        <li><i class="sw line" style="--c:#1d4ed8"></i><span data-i18n="legend.trail"></span></li>
        <li><i class="sw dot" style="--c:#0ea5e9"></i><span data-i18n="legend.point"></span></li>
        <li><i class="sw dot" style="--c:#f59e0b"></i><span data-i18n="legend.spot"></span></li>
        <li><i class="sw dot sota" style="--c:#6DA536"></i><span data-i18n="legend.sota"></span></li>
      </ul>
      <!-- Only worth the space once someone switched the layer on. -->
      <ul class="legend" id="legend-pois" hidden>
        <li><i class="sw dot" style="--c:#0369a1"></i><span data-i18n="poi.group.access"></span></li>
        <li><i class="sw dot" style="--c:#15803d"></i><span data-i18n="poi.group.comfort"></span></li>
        <li><i class="sw dot" style="--c:#b45309"></i><span data-i18n="poi.group.supply"></span></li>
        <li><i class="sw dot" style="--c:#7c3aed"></i><span data-i18n="poi.group.view"></span></li>
        <li><i class="sw dot" style="--c:#0f766e"></i><span data-i18n="poi.group.orientation"></span></li>
        <li><i class="sw dot" style="--c:#be123c"></i><span data-i18n="poi.group.target"></span></li>
        <li><i class="sw line" style="--c:#dc2626"></i><span data-i18n="poi.group.qrm"></span></li>
      </ul>
    </section>
  </div>

  <div class="tabpanel" id="tab-spots" role="tabpanel" aria-labelledby="tabbtn-spots" hidden>
    <section>
      <h2><span data-i18n="spots.head"></span> <span id="spotcount" class="counter"></span></h2>
      <div class="filterrow">
        <!-- Several bands at once, so the list is checkboxes rather than a
             select. The entries are filled from the band table in main.js -
             one list of bands, not two that drift apart. -->
        <details id="spot-band" class="dropdown">
          <summary id="spot-band-label" data-i18n-label="spots.band"></summary>
          <div id="spot-band-menu" class="dropdown-menu"></div>
        </details>
        <select id="spot-mode" data-i18n-label="spots.mode">
          <option value="" data-i18n="spots.allModes"></option>
          <option value="CW">CW</option>
          <option value="SSB" data-i18n="spots.phone"></option>
          <option value="DIGI" data-i18n="spots.digital"></option>
        </select>
        <select id="spot-sort" data-i18n-label="spots.sort">
          <option value="age" data-i18n="spots.newest"></option>
          <option value="freq" data-i18n="spots.byFreq"></option>
        </select>
      </div>
      <div class="filterrow">
        <label class="check"><input type="checkbox" id="spot-fresh"> <span data-i18n="spots.fresh"></span></label>
        <label class="check"><input type="checkbox" id="spot-qrt"> <span data-i18n="spots.hideQrt"></span></label>
        <label class="check"><input type="checkbox" id="spot-hunted"> <span data-i18n="spots.hideHunted"></span></label>
      </div>
      <div id="spotlist" class="spotlist"><p class="hint" data-i18n="spots.loading"></p></div>
      <p class="hint" data-i18n="spots.plusHint"></p>
    </section>
  </div>

  <div class="tabpanel" id="tab-me" role="tabpanel" aria-labelledby="tabbtn-me" hidden>
    <section>
      <h2 data-i18n="call.head"></h2>
      <div class="callrow">
        <input id="call" type="text" data-i18n-placeholder="call.placeholder" maxlength="12" autocomplete="off" spellcheck="false" data-i18n-label="call.aria">
        <input id="callcolor" type="color" value="#00a86b" data-i18n-label="call.colourAria">
      </div>
      <p class="hint" id="callhint" data-i18n="call.hint"></p>
      <label class="check"><input type="checkbox" id="opt-todo"> <span data-i18n="call.hideMine"></span></label>
    </section>

    <!-- Hunted parks. POTA hands the hunt list only to the logged in user, hence
         the detour via the CSV export. The file stays in the browser - no
         upload, no account, no list on our server. -->
    <section>
      <h2 data-i18n="hunted.head"></h2>
      <div class="callrow">
        <label class="wide-btn filebtn" for="hunted-file" data-i18n="hunted.load"></label>
        <input id="hunted-file" type="file" accept=".csv,text/csv,text/plain" hidden>
        <button id="hunted-clear" class="icon-btn" data-i18n-title="hunted.forget" hidden>✕</button>
      </div>
      <p class="hint" id="hunted-hint"></p>
      <label class="check"><input type="checkbox" id="opt-hide-hunted"> <span data-i18n="hunted.hide"></span></label>
    </section>
  </div>

  <div class="tabpanel" id="tab-outdoors" role="tabpanel" aria-labelledby="tabbtn-outdoors" hidden>
    <section>
      <h2 data-i18n="position.head"></h2>
      <label class="check"><input type="checkbox" id="opt-track"> <span data-i18n="position.track"></span></label>
      <p class="hint" id="track-hint"></p>
    </section>

    <section>
      <h2 data-i18n="poi.head"></h2>
      <label class="check"><input type="checkbox" id="opt-poi-access"> <span data-i18n="poi.group.access"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-comfort"> <span data-i18n="poi.group.comfort"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-supply"> <span data-i18n="poi.group.supply"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-view"> <span data-i18n="poi.group.view"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-orientation"> <span data-i18n="poi.group.orientation"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-target"> <span data-i18n="poi.group.target"></span></label>
      <label class="check"><input type="checkbox" id="opt-poi-qrm"> <span data-i18n="poi.group.qrm"></span></label>
      <p class="hint" data-i18n="poi.hint"></p>
      <p class="seghead" data-i18n="poi.zoom"></p>
      <div class="sliderrow">
        <input type="range" id="poi-zoom" min="13" max="18" step="1" value="15"
               data-i18n-label="poi.zoom">
        <output id="poi-zoom-value" for="poi-zoom"></output>
      </div>
      <p class="hint" data-i18n="poi.zoomHint"></p>
      <p class="seghead" data-i18n="poi.size"></p>
      <div class="sliderrow">
        <input type="range" id="poi-size" min="60" max="200" step="10" value="100"
               data-i18n-label="poi.size">
        <output id="poi-size-value" for="poi-size"></output>
      </div>
    </section>

    <section>
      <h2 data-i18n="offline.head"></h2>
      <button id="offline-btn" class="wide-btn" data-i18n="offline.save"></button>
      <p class="hint" id="offline-hint" data-i18n="offline.hint"></p>
    </section>

    <!-- Everything the map has kept on the device. Tiles are only ever
         replaced, never dropped first, so the one way to get rid of an old
         stock is to say so. -->
    <section>
      <h2 data-i18n="storage.head"></h2>
      <p class="hint" id="storage-size" data-i18n="storage.checking"></p>
      <button id="storage-btn" class="wide-btn" data-i18n="storage.clear"></button>
      <p class="hint" data-i18n="storage.hint"></p>
    </section>

  </div>

  <!-- Credits. Every data source that goes into the map is named here with its
       license; naming them is a condition of use, not politeness. Whoever adds a
       source to the pipeline adds it here and to the map attribution
       (src/main.js, customAttribution). Collapsed, but present on every tab -
       the credit must not disappear behind a choice. -->
  <footer id="credits">
    <p id="build-info"></p>
    <details>
      <summary data-i18n="credits.head"></summary>
      <!-- Filled from the catalogue in src/main.js: the sentences carry links,
           so they cannot be a plain data-i18n text node. -->
      <p id="credits-areas"></p>
      <p id="credits-pota"></p>
      <p id="credits-sota"></p>
      <p id="credits-pois"></p>
      <p id="credits-places"></p>
      <p id="credits-raster"></p>
    </details>
  </footer>
</aside>

<!-- A small pointer instead of an open panel. The map should have the whole
     screen on arrival; the pointer says what is behind the menu button and
     goes away as soon as the map is used. -->
<button id="menu-hint" type="button" data-i18n="menu.hint" hidden></button>

<div id="position-box" hidden></div>
<div id="readout"><span id="grid"></span><span id="coords"></span></div>
<div id="hoverinfo" hidden></div>

<!-- Reporting. The content is built in src/reports.js; this is only the
     shell: a <dialog> above the map that takes no space away from it. -->
<dialog id="report-dialog" data-i18n-label="report.aria">
  <div class="report-head">
    <h2 data-i18n="report.head"></h2>
    <button type="button" id="report-close" class="icon-btn" data-i18n-label="report.close">✕</button>
  </div>
  <div id="report-content"></div>
</dialog>

<script type="module" src="/app.js"></script>
<!-- Navigation bar shared with the operator's other sites. Purely optional:
     drop this line and the empty div above and nothing else changes. -->
<script src="https://afu.tools/nav.js" defer></script>
</body>
</html>
